<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/assets/blinkloop-icon.png" />
<meta name="robots" content="noindex, nofollow" />
<title>Team | BlinkLoop</title>
<script>(function(){var t=null;try{t=localStorage.getItem('bl-theme')}catch(e){}if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --rust:#F45D2A; --rust-deep:#D94E1F; --maroon:#7F2027; --bg:#FFFCF7; --bg2:#FFF7EF; --ink:#2B140E; --muted:#7E5D4C;
  --glass:rgba(251,235,221,.5); --glass-strong:rgba(255,247,239,.85); --line:rgba(127,32,39,.16);
}
:root[data-theme="dark"]{
  --bg:#140806; --bg2:#1D0D0A; --ink:#FAF4EA; --muted:#C9A395;
  --glass:rgba(250,244,234,.06); --glass-strong:rgba(250,244,234,.09); --line:rgba(250,244,234,.13);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  display:flex;flex-direction:column;
  background:
    radial-gradient(700px 500px at 90% -6%, rgba(127,32,39,.08), transparent 62%),
    radial-gradient(600px 460px at -8% 30%, rgba(244,93,42,.08), transparent 60%),
    var(--bg);
  color:var(--ink);font-family:'Sora',system-ui,sans-serif;font-size:15px;line-height:1.55;
}
a{color:var(--rust);text-decoration:none}
.daybar{border-bottom:1px solid var(--line);background:var(--glass-strong)}
.readonly{background:color-mix(in srgb, var(--rust) 8%, var(--bg));border-bottom:1px solid var(--line);text-align:center;padding:8px;font-size:.8rem;color:var(--muted)}
.reply-link{border:none;background:none;color:var(--rust);cursor:pointer;font:inherit;font-size:.75rem;font-weight:600;padding:2px 0;margin-top:4px;display:inline-flex;gap:5px;align-items:center}
.sr-item{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--glass-strong);cursor:pointer;font-size:.82rem}
.sr-item:hover{border-color:var(--rust)}
.sr-item .d{color:var(--muted);white-space:nowrap;font-size:.72rem}
.sr-item .a{font-weight:700;white-space:nowrap}
.sr-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:-16px 0 40px rgba(43,20,14,.15);z-index:80;display:none;flex-direction:column}
.drawer.open{display:flex}
.drawer .dhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--glass-strong)}
.drawer .dbody{flex:1;overflow-y:auto;padding:16px}
.drawer .dfoot{border-top:1px solid var(--line);padding:10px 12px;background:var(--glass-strong)}
.drawer .dfoot .composer textarea{min-height:40px}
.hl{animation:hl 2.4s ease}
@keyframes hl{0%,60%{background:color-mix(in srgb, var(--rust) 18%, transparent)}100%{background:transparent}}
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 18px;border-bottom:1px solid var(--line);background:var(--glass-strong);backdrop-filter:blur(12px);
}
.brand{font-family:'Unbounded';font-weight:700;font-size:.98rem}
.brand span{color:var(--rust)}
.brand em{font-style:normal;font-weight:500;font-size:.62rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-left:6px}
.hright{display:flex;align-items:center;gap:14px;font-size:.82rem;color:var(--muted)}
.hright b{color:var(--ink)}
.hbtn{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:transparent;color:var(--ink);font:inherit;font-size:.78rem;font-weight:600;cursor:pointer}
.hbtn:hover{border-color:var(--rust);color:var(--rust)}

#pinsBar{border-bottom:1px solid var(--line);background:var(--glass);display:none}
#pinsBar.has{display:block}
.pins-head{display:flex;align-items:center;gap:8px;padding:8px 18px;cursor:pointer;font-size:.78rem;font-weight:700;color:var(--maroon)}
:root[data-theme="dark"] .pins-head{color:var(--rust)}
.pins-head .n{font-weight:500;color:var(--muted)}
.pins-list{display:none;padding:0 18px 10px}
#pinsBar.open .pins-list{display:block}
.pin-item{display:flex;gap:8px;align-items:baseline;padding:6px 10px;margin-bottom:6px;background:var(--glass-strong);border:1px solid var(--line);border-radius:12px;font-size:.82rem}
.pin-item .a{font-weight:700;color:var(--rust);white-space:nowrap}
.pin-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin-item button{border:none;background:none;cursor:pointer;color:var(--muted);font-size:.85rem}

main{flex:1;overflow-y:auto;padding:20px 0}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.day{ text-align:center;color:var(--muted);font-size:.72rem;letter-spacing:.06em;margin:16px 0 10px;text-transform:uppercase}
.msg{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;color:#FFF7EC}
.msg .body{flex:1;min-width:0}
.mhead{display:flex;align-items:baseline;gap:8px}
.mhead .a{font-weight:700;font-size:.85rem}
.mhead .tm{color:var(--muted);font-size:.7rem}
.mhead .tools{margin-left:auto;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.msg:hover .tools{opacity:1}
.tools button{border:none;background:none;cursor:pointer;font-size:.8rem;color:var(--muted);padding:2px 4px}
.tools button:hover{color:var(--rust)}
.tools button.pinned{color:var(--rust);opacity:1}
.mtext{white-space:pre-wrap;word-wrap:break-word;font-size:.92rem;margin-top:2px}
.msg.pinned-msg .body{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.att{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--glass-strong);font-size:.82rem;max-width:100%}
.att .ic{font-size:1.05rem}
.att .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.att .sz{color:var(--muted);white-space:nowrap}
.att img{max-width:260px;max-height:180px;border-radius:10px;display:block}
.att.imgatt{padding:4px;background:transparent}
.empty{ text-align:center;color:var(--muted);padding:60px 20px;font-size:.9rem}

footer{border-top:1px solid var(--line);background:var(--glass-strong);backdrop-filter:blur(12px);padding:12px 0}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer textarea{
  flex:1;resize:none;background:var(--glass);border:1px solid var(--line);border-radius:14px;
  padding:11px 14px;font:inherit;color:inherit;min-height:44px;max-height:140px;
}
.composer textarea:focus{outline:none;border-color:var(--rust)}
.cbtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);cursor:pointer;font-size:1.05rem;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.cbtn:hover{border-color:var(--rust);color:var(--rust)}
.cbtn.send{background:var(--rust);border-color:var(--rust);color:#FFF7EC}
.cbtn.send:hover{background:var(--rust-deep)}
.cbtn:disabled{opacity:.5;cursor:wait}
#attPrev{display:none;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);padding:0 0 8px}
#attPrev.has{display:flex}
#attPrev b{color:var(--ink)}
#attPrev button{border:none;background:none;color:var(--muted);cursor:pointer}
.note{ text-align:center;color:var(--muted);font-size:.68rem;padding-top:8px;opacity:.8}

.msg.pending{opacity:.55}
.mtext a{color:var(--rust);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.jump{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;border:1px solid var(--rust);background:var(--rust);color:#FFF7EC;border-radius:999px;padding:8px 16px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;box-shadow:0 10px 26px rgba(217,78,31,.35)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.82rem;box-shadow:0 10px 26px rgba(0,0,0,.25);max-width:min(92vw,420px);text-align:center}

/* ---------- mobile ---------- */
@media (hover:none){
  .msg .tools{opacity:1}
}
@media (max-width:640px){
  body{font-size:14px}
  header{padding:10px 12px;gap:8px;flex-wrap:wrap}
  .brand{font-size:.9rem}
  .brand em{display:none}
  #who{display:none}
  .hright{gap:6px;font-size:.75rem;flex-wrap:wrap;justify-content:flex-end}
  .hbtn{padding:5px 10px;font-size:.7rem}
  #onlineBar{font-size:.72rem;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .daybar .wrap{flex-wrap:wrap;gap:8px;padding:8px 12px !important}
  #dayLabel{min-width:0 !important;font-size:.8rem !important}
  #searchIn{width:100% !important;order:9;font-size:16px !important;padding:9px 14px !important}
  .wrap{padding:0 12px}
  main{padding:12px 0}
  .msg{gap:9px;margin-bottom:12px}
  .av{width:30px;height:30px;font-size:.7rem}
  .mhead{flex-wrap:wrap;row-gap:2px}
  .mhead .a{font-size:.8rem}
  .mtext{font-size:.88rem}
  .msg .tools{gap:10px}
  .tools button{font-size:.95rem;padding:4px 6px}
  .reply-link{padding:6px 0;display:inline-block}
  .att .nm{max-width:46vw}
  .att img{max-width:70vw;max-height:220px}
  .composer{gap:8px}
  .composer textarea{font-size:16px;padding:10px 12px;min-height:42px}
  .cbtn{width:42px;height:42px}
  footer{padding:8px 0 10px}
  .note{display:none}
  .drawer .dfoot .composer textarea{font-size:16px}
  #readonlyBar{font-size:.75rem;padding:8px 10px}
  .pin-item .t{white-space:normal;max-height:2.6em;overflow:hidden}
}
</style>
</head>
<body>
<header>
  <div class="brand">Blink<span>Loop</span><em>Team</em></div>
  <div class="hright">
    <span id="onlineBar" title="Online now"></span>
    <span id="who"></span>
    <a class="hbtn" href="/">Site</a>
    <a class="hbtn" href="/builder">Builder</a>
    <a class="hbtn" href="/admin">Codes</a>
    <button class="hbtn" id="logout">Sign out</button>
  </div>
</header>

<div class="daybar">
  <div class="wrap" style="display:flex;align-items:center;gap:10px;padding:8px 18px">
    <button class="hbtn" id="dayPrev" title="Previous day">‹</button>
    <b id="dayLabel" style="font-size:.85rem;min-width:90px;text-align:center"></b>
    <button class="hbtn" id="dayNext" title="Next day">›</button>
    <button class="hbtn" id="dayToday" hidden>Today</button>
    <span style="flex:1"></span>
    <input id="searchIn" placeholder="Search chats…" style="background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:.8rem;color:inherit;width:min(260px,40vw)" />
  </div>
</div>

<div id="searchPanel" hidden style="border-bottom:1px solid var(--line);background:var(--glass);max-height:45vh;overflow-y:auto">
  <div class="wrap" style="padding:10px 18px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <b style="font-size:.8rem" id="searchTitle"></b><span style="flex:1"></span>
      <button class="hbtn" id="searchX">✕ Close</button>
    </div>
    <div id="searchRes"></div>
  </div>
</div>

<div id="pinsBar">
  <div class="pins-head" id="pinsHead">📌 Pinned <span class="n" id="pinsN"></span></div>
  <div class="pins-list" id="pinsList"></div>
</div>

<main id="main"><div class="wrap" id="feed">
  <div class="empty" id="empty">No messages yet. Say hi to the team.</div>
</div></main>

<div class="readonly" id="readonlyBar" hidden>Viewing an archived day. It is read-only. <button class="hbtn" id="roToday" style="padding:3px 12px">Jump to today</button> to keep chatting.</div>
<div class="drawer" id="drawer">
  <div class="dhead"><b style="font-size:.9rem">Thread</b><span style="flex:1"></span><button class="hbtn" id="drawerX">✕</button></div>
  <div class="dbody" id="drawerBody"></div>
  <div class="dfoot">
    <div class="composer">
      <textarea id="tText" placeholder="Reply in thread…" rows="1"></textarea>
      <button class="cbtn send" id="tSend" title="Reply">➤</button>
    </div>
  </div>
</div>
<button class="jump" id="jump" hidden>↓ New messages</button>
<div class="toast" id="toast" hidden></div>
<footer><div class="wrap">
  <div id="attPrev">📎 <b id="attName"></b> <span id="attSize"></span> <button id="attX" title="Remove">✕</button></div>
  <div class="composer">
    <button class="cbtn" id="attach" title="Attach a file">📎</button>
    <input type="file" id="file" hidden />
    <textarea id="text" placeholder="Message the team…" rows="1"></textarea>
    <button class="cbtn send" id="send" title="Send">➤</button>
  </div>
  <div class="note">Files up to 3.5 MB. Enter sends, Shift+Enter for a new line. Hover a message to pin 📌 or delete your own. Links open in a new tab.</div>
</div></footer>

<script>
"use strict";
const $ = s => document.querySelector(s);
let ME='', TODAY='', viewDay='', days=[], msgs=[], counts={}, pinnedIds=new Set(), pinnedFull=[], onlineNames=[], since=0, pendingAtt=null, openTh=null;
let pollTimer=null, inflight=false, quietSince=Date.now(), unread=0, lastSig='', lastThreadSig='';
const POLL_FAST=3000, POLL_SLOW=10000, POLL_HIDDEN=30000, QUIET_AFTER=90000;
const CACHE_KEY='bl-team-cache', DRAFT_KEY='bl-team-draft', BASE_TITLE=document.title;
const COLORS = ['#F45D2A','#7F2027','#2E7D5B','#0E7CD1','#7360F2','#B8860B','#C2185B'];
const colorFor = a => COLORS[[...a].reduce((n,c)=>n+c.charCodeAt(0),0) % COLORS.length];
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* runs on already-escaped text, so the URL is safe to drop into an attribute */
const linkify = s => s.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)"'\]])/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const renderText = t => linkify(esc(t));
const fmtSize = n => n>1048576 ? (n/1048576).toFixed(1)+' MB' : n>1024 ? (n/1024|0)+' KB' : n+' B';
const fmtTime = ts => new Date(ts).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Manila'});
const dayFromTs = ts => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Manila'}).format(new Date(ts)).replace(/-/g,'');
const dayName = y => y===TODAY ? 'Today' : new Date(Date.UTC(+y.slice(0,4),+y.slice(4,6)-1,+y.slice(6,8))).toLocaleDateString('en-PH',{month:'short',day:'numeric'});
const toLogin = () => { location.href = '/login?next=%2Fteam'; };
const atBottom = () => { const m=$('#main'); return m.scrollHeight - m.scrollTop - m.clientHeight < 80; };

/* ---------- instant paint: last known feed for today, then the network ---------- */
function readCache(){
  try{
    const c = JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    return c && c.day===c.today && c.today===dayFromTs(Date.now()) ? c : null;
  }catch(e){ return null; }
}
function writeCache(){
  if (viewDay!==TODAY) return;
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ me:ME, today:TODAY, day:viewDay, days, counts, pinnedIds:[...pinnedIds], pinned:pinnedFull, messages:msgs.filter(m=>!m.pending), online:onlineNames })); }catch(e){}
}
function saveDraft(v){ try{ v ? localStorage.setItem(DRAFT_KEY, v) : localStorage.removeItem(DRAFT_KEY); }catch(e){} }
let toastTimer=null;
function toast(text){
  const t = $('#toast'); t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, 3200);
}

async function boot(){
  const c = readCache();
  if (c){
    applyFeedData(c); msgs = c.messages||[];
    since = msgs.length ? Math.max(...msgs.map(m=>m.ts)) : 0;
    render(true); renderBar();
  }
  try{ const d = localStorage.getItem(DRAFT_KEY); if (d){ ta.value = d; ta.dispatchEvent(new Event('input')); } }catch(e){}
  await loadDay('');
  schedule(POLL_FAST);
  document.addEventListener('visibilitychange', ()=>{
    if (document.hidden) return;
    unread = 0; document.title = BASE_TITLE; quietSince = Date.now();
    pollNow();
  });
}

/* the API answers 401 without a valid session, so no separate /api/me round trip */
function applyFeedData(d){
  ME=d.me; TODAY=d.today; viewDay=d.day; counts=d.counts||{};
  if (d.days) days = d.days;
  pinnedIds = new Set(d.pinnedIds||[]);
  if (d.pinned) pinnedFull = d.pinned;            /* omitted by the server when nothing changed */
  else pinnedFull = pinnedFull.filter(p=>pinnedIds.has(p.id));
  if (d.online){
    onlineNames = d.online;
    $('#onlineBar').innerHTML = '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 3px rgba(46,204,113,.22)"></span>'+onlineNames.map(esc).join(', ')+'</span>';
  }
  $('#who').innerHTML = 'Signed in as <b>'+esc(ME)+'</b>';
}
async function loadDay(day){
  let r;
  try{ r = await fetch('/api/chat'+(day?'?day='+day:'')); }catch(e){ return; }
  if (r.status===401){ toLogin(); return; }
  const d = await r.json();
  if (!d.ok) return;
  applyFeedData(d);
  msgs = d.messages;
  since = msgs.length ? Math.max(...msgs.map(m=>m.ts)) : 0;
  lastSig = ''; render(true); renderBar(); writeCache();
}
async function pollToday(){
  if (inflight || viewDay!==TODAY || !TODAY) return;
  inflight = true;
  try{
    const r = await fetch('/api/chat?day='+TODAY+'&since='+since+'&pins='+[...pinnedIds].join(','));
    if (r.status===401){ toLogin(); return; }
    const d = await r.json();
    if (!d.ok) return;
    applyFeedData(d);
    const wasAtBottom = atBottom();
    const known = new Set(msgs.map(m=>m.id));
    const fresh = d.messages.filter(m=>!known.has(m.id));
    if (fresh.length){
      /* drop optimistic copies the server has now confirmed */
      msgs = msgs.filter(m=>!(m.pending && fresh.some(f=>f.author===m.author && f.text===m.text)));
      msgs = msgs.concat(fresh).sort((a,b)=>a.ts-b.ts);
      since = Math.max(since, ...fresh.map(m=>m.ts));
      quietSince = Date.now();
      const others = fresh.filter(m=>m.author!==ME).length;
      if (document.hidden && others){ unread += others; document.title = '('+unread+') '+BASE_TITLE; }
    }
    render(false); renderBar(); writeCache();
    if (fresh.length && !wasAtBottom && !document.hidden){ const j=$('#jump'); j.textContent = '↓ New message'+(fresh.length>1?'s':''); j.hidden = false; }
  }catch(e){}
  finally{ inflight = false; }
}
/* polling cadence: quick while the room is active, relaxed when quiet, slow while the tab is hidden */
function schedule(ms){ clearTimeout(pollTimer); pollTimer = setTimeout(tick, ms); }
async function tick(){
  await pollToday();
  if (openTh) await refreshThread(false);
  const quiet = Date.now() - quietSince > QUIET_AFTER;
  schedule(document.hidden ? POLL_HIDDEN : quiet ? POLL_SLOW : POLL_FAST);
}
function pollNow(){ clearTimeout(pollTimer); tick(); }

function renderBar(){
  $('#dayLabel').textContent = dayName(viewDay);
  const i = days.indexOf(viewDay);
  $('#dayPrev').disabled = i===-1 || i>=days.length-1;
  $('#dayNext').disabled = i<=0;
  const archived = viewDay!==TODAY;
  $('#dayToday').hidden = !archived;
  $('#readonlyBar').hidden = !archived;
  document.querySelector('footer').style.display = archived ? 'none' : '';
}
function attHTML(att, lazy){
  if (!att) return '';
  const isImg = /^image\//.test(att.type||'');
  return isImg
    ? `<a class="att imgatt" href="${esc(att.url)}" target="_blank" rel="noopener"><img src="${esc(att.url)}" alt="${esc(att.name)}"${lazy?' loading="lazy"':''} /></a>`
    : `<a class="att" href="${esc(att.url)}" target="_blank" rel="noopener" download><span class="ic">📄</span><span class="nm">${esc(att.name)}</span><span class="sz">${fmtSize(att.size)}</span></a>`;
}
/* only touch the DOM when something visible changed; a poll that finds nothing new leaves images and scroll alone */
const feedSig = () => msgs.map(m=>m.id+(m.pending?'p':'')).join('|')+'#'+JSON.stringify(counts)+'#'+[...pinnedIds].join(',')+'#'+pinnedFull.length+'#'+ME;
function render(scroll){
  const s = feedSig();
  if (!scroll && s===lastSig) return;
  lastSig = s;
  const stick = scroll || atBottom();
  let html = '';
  for (const m of msgs){
    const pinned = pinnedIds.has(m.id);
    const n = counts[m.id]||0;
    html += `<div class="msg ${pinned?'pinned-msg':''} ${m.pending?'pending':''}" data-id="${m.id}">
      <div class="av" style="background:${colorFor(m.author)}">${esc(m.author.slice(0,2))}</div>
      <div class="body">
        <div class="mhead"><span class="a" style="color:${colorFor(m.author)}">${esc(m.author)}</span><span class="tm">${m.pending?'Sending…':fmtTime(m.ts)}${pinned?' · 📌':''}</span>
          ${m.pending?'':`<span class="tools">
            <button data-pin="${m.id}" class="${pinned?'pinned':''}" title="${pinned?'Unpin':'Pin'}">📌</button>
            ${m.author===ME?`<button data-del="${m.id}" title="Delete">✕</button>`:''}
          </span>`}
        </div>
        ${m.text?`<div class="mtext">${renderText(m.text)}</div>`:''}
        ${attHTML(m.att, true)}
        ${m.pending?'':`<button class="reply-link" data-th="${m.id}">💬 ${n? n+(n===1?' reply':' replies') : 'Reply'}</button>`}
      </div>
    </div>`;
  }
  $('#feed').innerHTML = html || '<div class="empty">No messages on this day.</div>';
  renderPins();
  if (stick){ $('#main').scrollTop = $('#main').scrollHeight; $('#jump').hidden = true; }
}
function renderPins(){
  const bar = $('#pinsBar');
  bar.classList.toggle('has', pinnedFull.length>0);
  $('#pinsN').textContent = pinnedFull.length ? '('+pinnedFull.length+')' : '';
  $('#pinsList').innerHTML = pinnedFull.map(m=>`
    <div class="pin-item" data-goto="${m.id}" data-day="${m.day}" style="cursor:pointer">
      <span class="a">${esc(m.author)}</span>
      <span class="t">${esc(m.text || (m.att ? '📎 '+m.att.name : ''))}</span>
      <span style="color:var(--muted);font-size:.72rem;white-space:nowrap">${dayName(m.day)}</span>
      <button data-unpin="${m.id}" title="Unpin">✕</button>
    </div>`).join('');
}
function flash(id, root){
  const el = (root||document).querySelector(`[data-id="${id}"]`);
  if (!el) return;
  el.scrollIntoView({block:'center'});
  el.classList.remove('hl'); void el.offsetWidth; el.classList.add('hl');
}
$('#jump').addEventListener('click', ()=>{ $('#main').scrollTop = $('#main').scrollHeight; $('#jump').hidden = true; });
$('#main').addEventListener('scroll', ()=>{ if (atBottom()) $('#jump').hidden = true; }, {passive:true});

/* ---------- threads ---------- */
async function openThread(id, hlId){
  openTh = id; lastThreadSig = '';
  $('#drawer').classList.add('open');
  $('#drawerBody').innerHTML = '<div class="empty">Loading…</div>';
  await refreshThread(true, hlId);
  $('#tText').focus();
}
function threadMsgHTML(m, isRoot){
  return `<div class="msg" data-id="${m.id}" style="${isRoot?'padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px':''}">
    <div class="av" style="background:${colorFor(m.author)}">${esc(m.author.slice(0,2))}</div>
    <div class="body">
      <div class="mhead"><span class="a" style="color:${colorFor(m.author)}">${esc(m.author)}</span><span class="tm">${fmtTime(m.ts)} · ${dayName(m.day||dayFromTs(m.ts))}</span>
        <span class="tools">${!isRoot && m.author===ME?`<button data-del="${m.id}" data-parent="${openTh}" title="Delete">✕</button>`:''}</span>
      </div>
      ${m.text?`<div class="mtext">${renderText(m.text)}</div>`:''}
      ${attHTML(m.att, false)}
    </div>
  </div>`;
}
async function refreshThread(scroll, hlId){
  if (!openTh) return;
  try{
    const r = await fetch('/api/chat?thread='+openTh); const d = await r.json();
    if (!d.ok){ closeThread(); return; }
    counts[openTh] = d.replies.length;
    const tsig = d.root.id+'|'+d.replies.map(m=>m.id).join(',');
    if (scroll || tsig!==lastThreadSig){
      lastThreadSig = tsig;
      $('#drawerBody').innerHTML = threadMsgHTML(d.root, true) + d.replies.map(m=>threadMsgHTML(m,false)).join('');
      if (scroll) $('#drawerBody').scrollTop = $('#drawerBody').scrollHeight;
      if (hlId) flash(hlId, $('#drawerBody'));
    }
    render(false);
  }catch(e){}
}
function closeThread(){ openTh=null; $('#drawer').classList.remove('open'); }
$('#drawerX').addEventListener('click', closeThread);
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && openTh) closeThread(); });
$('#tSend').addEventListener('click', sendReply);
$('#tText').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendReply(); } });
async function sendReply(){
  const text = $('#tText').value.trim();
  if (!text || !openTh) return;
  const btn = $('#tSend'); btn.disabled = true;
  try{
    const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'post', text, parent: openTh})});
    const d = await r.json();
    if (d.ok){ $('#tText').value=''; await refreshThread(true); }
    else toast('Reply not sent. Try again.');
  }catch(e){ toast('Reply not sent. Check your connection.'); }
  finally{ btn.disabled = false; }
}

/* ---------- search ---------- */
$('#searchIn').addEventListener('keydown', async e=>{
  if (e.key!=='Enter') return;
  const q = $('#searchIn').value.trim();
  if (!q) return;
  $('#searchPanel').hidden = false;
  $('#searchTitle').textContent = 'Searching…';
  $('#searchRes').innerHTML = '';
  try{
    const r = await fetch('/api/chat?q='+encodeURIComponent(q)); const d = await r.json();
    if (!d.ok) return;
    $('#searchTitle').textContent = d.hits.length + ' result' + (d.hits.length===1?'':'s') + ' for “' + q + '”';
    $('#searchRes').innerHTML = d.hits.map(h=>`
      <div class="s-hit" data-sid="${h.id}" data-sparent="${h.parent||''}" data-sday="${h.day}"
           style="display:flex;gap:10px;align-items:baseline;padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer;background:var(--glass-strong)">
        <span style="color:var(--muted);font-size:.72rem;white-space:nowrap;min-width:52px">${dayName(h.day)}</span>
        <span style="font-weight:700;color:${colorFor(h.author)};font-size:.8rem">${esc(h.author)}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.84rem">${esc(h.text || (h.att?'📎 '+h.att.name:''))}</span>
        ${h.parent?'<span style="font-size:.68rem;color:var(--muted)">in thread</span>':''}
      </div>`).join('') || '<div class="empty" style="padding:20px">Nothing found.</div>';
  }catch(e){ $('#searchTitle').textContent = 'Search failed. Try again.'; }
});
$('#searchX').addEventListener('click', ()=>{ $('#searchPanel').hidden = true; $('#searchIn').value=''; });
document.addEventListener('click', async e=>{
  const hit = e.target.closest('.s-hit');
  if (hit){
    $('#searchPanel').hidden = true;
    if (hit.dataset.sparent){ openThread(hit.dataset.sparent, hit.dataset.sid); }
    else { await loadDay(hit.dataset.sday); flash(hit.dataset.sid); }
    return;
  }
  const goto = e.target.closest('.pin-item');
  if (goto && !e.target.closest('[data-unpin]')){
    if (goto.dataset.day !== viewDay) await loadDay(goto.dataset.day);
    flash(goto.dataset.goto);
    return;
  }
  const th = e.target.closest('[data-th]');
  if (th){ openThread(th.dataset.th); return; }
  const pin = e.target.closest('[data-pin]');
  if (pin){
    const id = pin.dataset.pin;
    const action = pinnedIds.has(id) ? 'unpin' : 'pin';
    if (action==='pin'){ pinnedIds.add(id); const m=msgs.find(x=>x.id===id); if(m) pinnedFull.unshift({...m, day:viewDay}); }
    else { pinnedIds.delete(id); pinnedFull = pinnedFull.filter(p=>p.id!==id); }
    render(false);
    await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id})});
    return;
  }
  const unpin = e.target.closest('[data-unpin]');
  if (unpin){
    pinnedIds.delete(unpin.dataset.unpin);
    pinnedFull = pinnedFull.filter(p=>p.id!==unpin.dataset.unpin);
    render(false);
    await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'unpin',id:unpin.dataset.unpin})});
    return;
  }
  const del = e.target.closest('[data-del]');
  if (del){
    const id = del.dataset.del, parent = del.dataset.parent||'';
    if (parent){ await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'del',id,parent})}); refreshThread(false); }
    else {
      msgs = msgs.filter(m=>m.id!==id); pinnedIds.delete(id); pinnedFull = pinnedFull.filter(p=>p.id!==id); render(false); writeCache();
      await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'del',id})});
    }
    return;
  }
});
$('#pinsHead').addEventListener('click', ()=>$('#pinsBar').classList.toggle('open'));

/* ---------- day navigation ---------- */
$('#dayPrev').addEventListener('click', ()=>{ const i=days.indexOf(viewDay); if(i<days.length-1) loadDay(days[i+1]); });
$('#dayNext').addEventListener('click', ()=>{ const i=days.indexOf(viewDay); if(i>0) loadDay(days[i-1]); });
$('#dayToday').addEventListener('click', ()=>loadDay(TODAY));
$('#roToday').addEventListener('click', ()=>loadDay(TODAY));

/* ---------- composer ---------- */
const ta = $('#text');
ta.addEventListener('input', ()=>{ ta.style.height='auto'; ta.style.height=Math.min(140, ta.scrollHeight)+'px'; saveDraft(ta.value); });
ta.addEventListener('keydown', e=>{ if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
$('#send').addEventListener('click', send);
$('#attach').addEventListener('click', ()=>$('#file').click());
$('#attX').addEventListener('click', ()=>{ pendingAtt=null; $('#attPrev').classList.remove('has'); });
$('#file').addEventListener('change', async ()=>{
  const f = $('#file').files[0]; $('#file').value='';
  if (!f) return;
  if (f.size > 3.5*1024*1024 && !/^image\//.test(f.type)) { toast('Files up to 3.5 MB only.'); return; }
  const btn = $('#attach'); btn.disabled = true;
  try{
    let blob = f, type = f.type || 'application/octet-stream';
    if (/^image\/(jpeg|png|webp)/.test(f.type) && f.size > 400*1024){
      const url = URL.createObjectURL(f);
      const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
      const MAX=1800, sc = Math.min(1, MAX/Math.max(img.naturalWidth,img.naturalHeight));
      const c = document.createElement('canvas'); c.width=img.naturalWidth*sc|0; c.height=img.naturalHeight*sc|0;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      blob = await new Promise(r=>c.toBlob(r,'image/jpeg',.85)) || f;
      type = 'image/jpeg';
      URL.revokeObjectURL(url);
    }
    if (blob.size > 3.5*1024*1024){ toast('That file is too large even after compression.'); return; }
    const b64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); });
    const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'file',name:f.name,type,data:b64})});
    const d = await r.json();
    if (d.ok){ pendingAtt = d.att; $('#attName').textContent = d.att.name; $('#attSize').textContent = fmtSize(d.att.size); $('#attPrev').classList.add('has'); }
    else toast(d.reason==='too-large' ? 'That file is too large (max 3.5 MB).' : 'Upload failed. Try again.');
  }catch(e){ toast('Upload failed. Try again.'); }
  finally{ btn.disabled = false; }
});
/* optimistic send: the message shows at once, the server confirms in the background */
async function send(){
  const text = ta.value.trim();
  if ((!text && !pendingAtt) || viewDay!==TODAY || !ME) return;
  const att = pendingAtt;
  const tmp = { id:'tmp-'+Date.now(), parent:null, ts:Date.now(), author:ME, text, att, pending:true };
  msgs.push(tmp);
  ta.value=''; ta.style.height='auto'; saveDraft('');
  pendingAtt=null; $('#attPrev').classList.remove('has');
  render(true);
  try{
    const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'post', text, att})});
    if (r.status===401){ toLogin(); return; }
    const d = await r.json();
    if (!d.ok) throw new Error(d.reason||'failed');
    const i = msgs.findIndex(m=>m.id===tmp.id);
    if (i>-1) msgs[i] = d.message;
    else if (!msgs.some(m=>m.id===d.message.id)) msgs.push(d.message);
    since = Math.max(since, d.message.ts); quietSince = Date.now();
    render(false); writeCache();
  }catch(e){
    msgs = msgs.filter(m=>m.id!==tmp.id);
    ta.value = text; ta.dispatchEvent(new Event('input'));
    pendingAtt = att; if (att) $('#attPrev').classList.add('has');
    render(false);
    toast('Not sent. Check your connection and try again.');
  }
}
$('#logout').addEventListener('click', async ()=>{
  try{ await fetch('/api/logout',{method:'POST'}); }catch(e){}
  try{ localStorage.removeItem(CACHE_KEY); localStorage.removeItem(DRAFT_KEY); localStorage.removeItem('lb-access'); }catch(e){}
  location.href = '/login';
});
boot();
</script>
